[package]
name = "rubber-duck-desktop"
version = "0.1.0"
description = "Floating rubber duck desktop companion"
authors = ["you"]
edition = "2021"

[lib]
name = "rubber_duck_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
command-group = "5.0.1"
dotenvy = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
rfd = "0.16.1"
dunce = "1.0.5"
